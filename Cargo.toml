[package]
name = "mirror-frontend"
version = "0.1.2"
edition = "2024"

[dependencies]
axum = "0.8"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
